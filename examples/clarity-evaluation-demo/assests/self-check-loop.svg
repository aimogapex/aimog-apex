<svg width="760" height="360" viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg">
  <style>
    .node {
      fill: #f8fafc;
      stroke: #94a3b8;
      stroke-width: 2;
      rx: 12;
      ry: 12;
    }
    .text {
      font-family: "Segoe UI", sans-serif;
      font-size: 15px;
      fill: #1e293b;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .arrow {
      stroke: #64748b;
      stroke-width: 2;
      fill: none;
      marker-end: url(#arrowhead);
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Nodes -->
  <rect class="node" x="40" y="40" width="160" height="50"/>
  <text class="text" x="120" y="65">User Request</text>

  <rect class="node" x="260" y="40" width="180" height="50"/>
  <text class="text" x="350" y="65">Understanding</text>

  <rect class="node" x="510" y="40" width="200" height="50"/>
  <text class="text" x="610" y="65">Context Gathering</text>

  <rect class="node" x="140" y="160" width="200" height="50"/>
  <text class="text" x="240" y="185">Draft Response</text>

  <rect class="node" x="420" y="160" width="200" height="50"/>
  <text class="text" x="520" y="185">Self‑Evaluation</text>

  <rect class="node" x="260" y="280" width="200" height="50"/>
  <text class="text" x="360" y="305">Final Output</text>

  <!-- Arrows -->
  <line class="arrow" x1="200" y1="65" x2="260" y2="65"/>
  <line class="arrow" x1="440" y1="65" x2="510" y2="65"/>
  <line class="arrow" x1="610" y1="90" x2="610" y2="160"/>

  <line class="arrow" x1="240" y1="210" x2="420" y2="210"/>
  <line class="arrow" x1="520" y1="210" x2="360" y2="280"/>

  <!-- Loopback arrow -->
  <path class="arrow" d="M 520 160 C 520 120, 240 120, 240 160"/>
</svg>